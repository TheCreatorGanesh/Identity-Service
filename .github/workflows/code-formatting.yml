name: code-formatting

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: ${{ vars.DOTNET_VERSION || '10.0.x' }}
  SOLUTION_FILE: ${{ vars.SOLUTION_FILE || 'IdentityService.slnx' }}
  FORMAT_SEVERITY: ${{ vars.FORMAT_SEVERITY || 'error' }}
  FORMAT_VERBOSITY: ${{ vars.FORMAT_VERBOSITY || 'normal' }}

permissions:
  contents: read

jobs:
  format-check:
    name: Code Formatting
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Verify code formatting
        run: >
          dotnet format "${{ env.SOLUTION_FILE }}"
          --verify-no-changes
          --no-restore
          --severity "${{ env.FORMAT_SEVERITY }}"
          --verbosity "${{ env.FORMAT_VERBOSITY }}"
