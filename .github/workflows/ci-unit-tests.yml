name: ci-unit-tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore IdentityService.slnx

      - name: Build solution
        run: dotnet build IdentityService.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test tests/IdentityService.UnitTests/IdentityService.UnitTests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Generate Test & Coverage Summary
        if: always()
        run: node .github/scripts/generate-test-summary.js tests/IdentityService.UnitTests/TestResults

      - name: Publish PR Comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f test-summary.md ]; then
            COMMENT_TAG="<!-- unit-test-coverage-summary -->"
            BODY="${COMMENT_TAG}"$'\n\n'"$(cat test-summary.md)"
            
            EXISTING_COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq ".[] | select(.body | contains(\"${COMMENT_TAG}\")) | .id" | head -n 1)
            
            if [ -n "$EXISTING_COMMENT_ID" ]; then
              echo "Updating existing PR comment: $EXISTING_COMMENT_ID"
              gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}" \
                -f body="$BODY"
            else
              echo "Creating new PR comment"
              gh pr comment "${PR_NUMBER}" --body "$BODY"
            fi
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            tests/IdentityService.UnitTests/TestResults/**/*.trx
            tests/IdentityService.UnitTests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 7
