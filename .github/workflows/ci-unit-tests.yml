name: ci-unit-tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: ${{ vars.DOTNET_VERSION }}
  SOLUTION_FILE: ${{ vars.SOLUTION_FILE }}
  BUILD_CONFIGURATION: ${{ vars.BUILD_CONFIGURATION }}
  UNIT_TEST_PROJECT: ${{ vars.UNIT_TEST_PROJECT }}
  TEST_RESULTS_DIR: ${{ vars.TEST_RESULTS_DIR }}
  COVERLET_SETTINGS: ${{ vars.COVERLET_SETTINGS }}
  TRX_LOG_FILE: ${{ vars.TRX_LOG_FILE }}
  COVERAGE_FILE_NAME: ${{ vars.COVERAGE_FILE_NAME }}
  SUMMARY_SCRIPT: ${{ vars.SUMMARY_SCRIPT }}
  SUMMARY_OUTPUT_FILE: ${{ vars.SUMMARY_OUTPUT_FILE }}
  PR_COMMENT_TAG: ${{ vars.PR_COMMENT_TAG }}
  ARTIFACT_NAME: ${{ vars.UNIT_TEST_ARTIFACT_NAME }}
  ARTIFACT_RETENTION_DAYS: ${{ vars.ARTIFACT_RETENTION_DAYS }}

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ${{ vars.RUNNER_OS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build solution
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore

      - name: Run unit tests
        run: >
          dotnet test "${{ env.UNIT_TEST_PROJECT }}"
          --configuration "${{ env.BUILD_CONFIGURATION }}"
          --no-build
          --verbosity normal
          --settings "${{ env.COVERLET_SETTINGS }}"
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=${{ env.TRX_LOG_FILE }}"

      - name: Generate Test & Coverage Summary
        if: always()
        run: node "${{ env.SUMMARY_SCRIPT }}" "${{ env.TEST_RESULTS_DIR }}"

      - name: Publish PR Comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f "$SUMMARY_OUTPUT_FILE" ]; then
            BODY="${PR_COMMENT_TAG}"$'\n\n'"$(cat "$SUMMARY_OUTPUT_FILE")"

            EXISTING_COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq ".[] | select(.body | contains(\"${PR_COMMENT_TAG}\")) | .id" | head -n 1)

            if [ -n "$EXISTING_COMMENT_ID" ]; then
              echo "Updating existing PR comment: $EXISTING_COMMENT_ID"
              gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}" \
                -f body="$BODY"
            else
              echo "Creating new PR comment"
              gh pr comment "${PR_NUMBER}" --body "$BODY"
            fi
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.TEST_RESULTS_DIR }}/**/*.trx
            ${{ env.TEST_RESULTS_DIR }}/**/${{ env.COVERAGE_FILE_NAME }}
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
