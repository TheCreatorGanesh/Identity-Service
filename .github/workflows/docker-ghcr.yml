name: docker-ghcr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.DOCKER_REGISTRY }}
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
  PR_IMAGE_NAME: ${{ vars.DOCKER_PR_IMAGE_NAME }}
  DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH }}
  DOCKER_CONTEXT: ${{ vars.DOCKER_CONTEXT }}
  DOCKER_PLATFORMS: ${{ vars.DOCKER_PLATFORMS }}
  TRIVY_FORMAT: ${{ vars.TRIVY_FORMAT }}
  TRIVY_OUTPUT_FILE: ${{ vars.TRIVY_OUTPUT_FILE }}
  TRIVY_SEVERITY: ${{ vars.TRIVY_SEVERITY }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  docker:
    name: Docker Build & Push
    runs-on: ${{ vars.RUNNER_OS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}

      - name: Build Docker image (PR verification)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          load: true
          push: false
          tags: ${{ env.PR_IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan PR Docker image with Trivy
        id: trivy
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.PR_IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          format: ${{ env.TRIVY_FORMAT }}
          output: ${{ env.TRIVY_OUTPUT_FILE }}
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security
        if: github.event_name == 'pull_request' && steps.trivy.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.TRIVY_OUTPUT_FILE }}

      - name: Build and push multi-arch Docker image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
