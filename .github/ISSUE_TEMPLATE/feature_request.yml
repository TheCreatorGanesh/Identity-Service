name: 💡 Feature Request
description: Propose a new feature, capability, or architectural enhancement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for Identity Service! Please describe your proposal below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a specific limitation or pain point?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: Detailed description of the feature or behavior...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Target Area
      description: Which area of the service does this enhancement touch?
      options:
        - Authentication & Authorization
        - Identity Providers (e.g. OAuth, OIDC, Auth0, Okta, Firebase)
        - Token Management & Security (JWT, Refresh Tokens, Revocation)
        - API Endpoints & Contracts
        - Infrastructure & Performance
        - Testing & CI/CD
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, diagrams, or mock payloads here.
